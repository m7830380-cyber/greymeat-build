name: Build Android APK
# Public build runner; game files + outputs live in the private repo (env.PRIV). Same pipeline as ios.yml, for an IL2CPP arm64 OpenGL ES 3 APK (release "apk").
on:
  workflow_dispatch:
    inputs:
      ref_only:
        description: 'build the shell only and upload its Data (GLES reference)'
        default: 'false'
permissions: {contents: write}
env:
  PRIV: m7830380-cyber/greymeat-ios
  UNITY_VERSION: 6000.6.0f1
  UNITY_CHANGESET: f7f8ed4d1e24
  NDK_VERSION: 27.2.12479018
jobs:
  android:
    if: github.actor == github.repository_owner
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Game files
        env: {GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}'}
        run: |
          set -e
          gh release download src -R ${{ env.PRIV }} -p game.zip
          unzip -q game.zip && rm game.zip
          echo "GDATA=$PWD/Greymeat/Greymeat_Data" >> $GITHUB_ENV

      - name: Build tools (HLSLcc, bc6hdec)
        if: inputs.ref_only != 'true'
        run: |
          set -e
          cmake -S tools/hlslcc_cli -B /tmp/hb -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-std=c++14 -w" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 > /dev/null
          cmake --build /tmp/hb -j 4 2>&1 | grep -E "error" | head -40 || true
          echo "HLSLCC_CLI=/tmp/hb/hlslcc_cli" >> $GITHUB_ENV
          cmake -S tools/bc6hdec -B /tmp/bb -DCMAKE_BUILD_TYPE=Release > /dev/null && cmake --build /tmp/bb > /dev/null
          echo "BC6HDEC_DLL=$(ls /tmp/bb/libbc6hdec.* | head -1)" >> $GITHUB_ENV

      - name: Patch assemblies
        run: |
          set -e
          dotnet build shim/GreyShim.csproj -c Release -p:ManagedDir="$GDATA/Managed" -o /tmp/shim 2>&1 | grep -E "error|Build succeeded" | head -30; test -f /tmp/shim/GreyShim.dll
          mkdir -p shell/Assets/Plugins/Game
          dotnet run --project tools/patcher/GreyPatcher.csproj -c Release -- patch "$GDATA/Managed" /tmp/shim/GreyShim.dll shell/Assets/Plugins/Game

      - name: Convert data (DX11 -> GLES3, BC -> ASTC)
        if: inputs.ref_only != 'true'
        run: |
          set -e
          pip -q install UnityPy lz4 texture2ddecoder astc-encoder-py numpy
          GREY_TARGET=android python tools/convert_data.py "$GDATA" /tmp/data
          # BlueStacks build: same shaders, original BC textures (its PC GPU has S3TC/BPTC; its ASTC 6x6 emulation draws noise)
          GREY_TARGET=android GREY_TEX=keep python tools/convert_data.py "$GDATA" /tmp/data_bs > /dev/null
          python -c "
          import json
          r = json.load(open('/tmp/data_report.json'))
          for f, v in r.items():
              if not isinstance(v, dict): continue
              for n, s in v.get('shaders', {}).items(): print(f, n, s)
              for n, m in v.get('shader_msgs', {}).items(): print('MSG', n, m[:6])
              for n, m in v.get('shader_errors', {}).items(): print('ERR', n, m[-600:])
          "
          echo "COLOR_SPACE=Gamma" >> $GITHUB_ENV

      - name: Restore Unity
        id: uc
        uses: actions/cache/restore@v4
        with: {path: /Applications/Unity, key: 'unity-6000.6.0f1-android-arm64-v1'}

      - name: Install Unity
        if: steps.uc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE=https://download.unity3d.com/download_unity/$UNITY_CHANGESET
          curl -fsSL --retry 3 -o /tmp/editor.pkg "$BASE/MacEditorInstallerArm64/Unity-$UNITY_VERSION.pkg" &
          curl -fsSL --retry 3 -o /tmp/android.pkg "$BASE/MacEditorTargetInstaller/UnitySetup-Android-Support-for-Editor-$UNITY_VERSION.pkg" &
          wait
          sudo installer -pkg /tmp/editor.pkg -target / > /dev/null
          sudo installer -pkg /tmp/android.pkg -target / > /dev/null
          rm -f /tmp/*.pkg
          sudo chown -R "$(whoami)" /Applications/Unity
          find /Applications/Unity -maxdepth 4 -name PlaybackEngines -exec ls {} \; || true

      - name: Save Unity
        if: steps.uc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: {path: /Applications/Unity, key: 'unity-6000.6.0f1-android-arm64-v1'}

      - name: Android SDK / NDK / JDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null
          ls "$SDK/ndk" "$SDK/platforms" "$SDK/build-tools"
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "GREY_NDK=$SDK/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "GREY_JDK=${JAVA_HOME_17_arm64:-$JAVA_HOME_17_X64}" >> $GITHUB_ENV
          echo "BT=$SDK/build-tools/$(ls "$SDK/build-tools" | sort -V | tail -n 1)" >> $GITHUB_ENV

      - name: Activate Unity
        timeout-minutes: 12
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set +e
          chmod +x ci/unity.sh
          SERIAL=$(printf '%s' "$UNITY_LICENSE" | python3 -c "import sys,re,base64; d=re.search(r'<DeveloperData Value=\"([^\"]+)\"',sys.stdin.read()).group(1); print(base64.b64decode(d)[4:].decode())")
          [ -n "$SERIAL" ] || { echo "no serial in UNITY_LICENSE"; exit 1; }
          echo "::add-mask::$SERIAL"
          mkdir -p /tmp/activate-project
          for d in "/Library/Application Support/Unity" "/Library/Application Support/Unity/licenses" "$HOME/Library/Unity/licenses"; do
            sudo mkdir -p "$d"; sudo chown -R "$(whoami)" "$d"; sudo chmod -R 775 "$d"
          done
          mkdir -p "$HOME/Library/Unity/cache"
          OK="License activated successfully|license is already valid and activated|Successfully activated"
          for a in 1 2; do
            ci/unity.sh /tmp/activate.log 300 "$OK" -quit -serial "$SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -projectPath /tmp/activate-project
            rc=$?; [ $rc = 0 ] && break; tail -n 40 /tmp/activate.log
          done
          exit $rc

      - name: Unity build (APK)
        timeout-minutes: 100
        env:
          SHELL_OUT: ${{ github.workspace }}/out/shell.apk
        run: |
          set +e
          ci/unity.sh "$PWD/unity.log" 5700 "" -quit -projectPath "$PWD/shell" -buildTarget Android -executeMethod AndroidShellBuild.Build
          rc=$?
          echo "---- errors"; grep -n -i -E "error|exception|failed" unity.log | grep -v -i warning | head -n 80
          tail -n 60 unity.log
          [ -f out/shell.apk ] || exit 1
          ls -l out
          exit $rc

      - name: Upload Unity log on failure (private)
        if: failure()
        env: {GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}'}
        run: |
          [ -f unity.log ] && gzip -c unity.log > unity-android.log.gz && gh release upload src unity-android.log.gz --clobber -R ${{ env.PRIV }} || true

      - name: Upload shell reference data (private)
        env: {GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}'}
        run: |
          set -e
          rm -rf ref && mkdir ref && cd ref && unzip -q ../out/shell.apk 'assets/*' && find assets | head -60
          zip -qr ../shellref-android.zip assets && cd ..
          gh release upload src shellref-android.zip --clobber -R ${{ env.PRIV }}

      - name: Return Unity license
        if: always()
        timeout-minutes: 4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          ls -d /Applications/Unity/Unity.app /Applications/Unity/*/Unity.app >/dev/null 2>&1 || exit 0
          ci/unity.sh /tmp/return.log 150 "" -quit -returnlicense -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" || true

      - name: Swap in game data + sign
        if: inputs.ref_only != 'true'
        run: |
          set -e
          keytool -genkeypair -keystore /tmp/grey.jks -storepass greymeat -keypass greymeat -alias grey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Greymeat" > /dev/null 2>&1
          for v in "Greymeat:/tmp/data" "Greymeat-BlueStacks:/tmp/data_bs"; do
            n=${v%%:*}; d=${v#*:}
            python ci/repack_apk.py out/shell.apk "$d" Greymeat/Greymeat_Data/RuntimeInitializeOnLoads.json out/unsigned.apk
            "$BT/zipalign" -f -P 16 4 out/unsigned.apk out/aligned.apk
            "$BT/apksigner" sign --ks /tmp/grey.jks --ks-pass pass:greymeat --key-pass pass:greymeat --out $n.apk out/aligned.apk
            "$BT/apksigner" verify $n.apk && ls -lh $n.apk
          done

      - name: Publish (private release)
        if: inputs.ref_only != 'true'
        env: {GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}'}
        run: |
          gh release view apk -R ${{ env.PRIV }} > /dev/null 2>&1 || gh release create apk -R ${{ env.PRIV }} --title "Greymeat Android" --notes "APK" --prerelease
          gh release upload apk Greymeat.apk Greymeat-BlueStacks.apk --clobber -R ${{ env.PRIV }}
          gh release edit apk -R ${{ env.PRIV }} --notes "Mobile port by piece89 (Discord). Run ${{ github.run_number }} (${{ github.sha }})"
